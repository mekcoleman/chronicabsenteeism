<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Graphic Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #1e293b;
            margin-bottom: 10px;
        }
        
        .intro {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        iframe {
            width: 100%;
            border: none;
            display: block;
            /* Initial height - will auto-adjust */
            height: 2000px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Illinois School Data Analysis</h1>
        <p class="intro">
            This interactive graphic allows you to explore chronic absenteeism and academic 
            proficiency data for Illinois schools. Search for your school, select different 
            student groups, and compare data from 2020-21 to 2024-25.
        </p>
        
        <!-- Embed the graphic -->
        <iframe 
            id="school-graphic" 
            src="chronic_absenteeism_graphic.html"
            scrolling="no">
        </iframe>
    </div>

    <script>
        // Listen for height messages from the iframe
        window.addEventListener('message', function(event) {
            if (event.data.type === 'resize') {
                const iframe = document.getElementById('school-graphic');
                iframe.style.height = event.data.height + 'px';
            }
        });
    </script>
</body>
</html>
